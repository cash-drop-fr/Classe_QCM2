<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087f70">
<title>ClasseQCM — Créez, partagez, évaluez</title>
<style>
:root{--teal:#087f70;--teal2:#0b9b86;--ink:#202b2a;--muted:#687573;--line:#dce6e3;--bg:#f4f8f7;--white:#fff;--red:#b83a42;--green:#287a55;--shadow:0 10px 30px #163d3510}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--teal);color:white}button:hover{filter:brightness(1.06)}button.secondary{background:#e7f2ef;color:var(--teal)}button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}button.danger{background:#fff0f0;color:var(--red)}button.small{padding:7px 10px;font-size:13px;border-radius:9px}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.topin{max-width:1180px;margin:auto;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:20px;font-weight:900;letter-spacing:-.7px;color:var(--teal)}.brand span{color:var(--ink)}.wrap{max-width:1180px;margin:28px auto;padding:0 20px}.hero{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}.hero h1{font-size:clamp(25px,4vw,36px);line-height:1.1;margin:0 0 8px}.muted{color:var(--muted)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.tab{background:#e8efed;color:#52605d}.tab.active{background:var(--teal);color:#fff}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-weight:750;font-size:14px}.field input,.field textarea,.field select,.answer-input{width:100%;border:1px solid #cddbd7;border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field textarea:focus,.field select:focus,.answer-input:focus{border-color:var(--teal);box-shadow:0 0 0 3px #087f7018}.field textarea{min-height:78px;resize:vertical}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.question-card{border:1px solid var(--line);border-radius:15px;padding:16px;margin:14px 0;background:#fbfdfc}.question-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{font-size:12px;font-weight:800;padding:5px 9px;border-radius:99px;background:#e5f4ef;color:var(--teal)}.options{display:grid;gap:8px;margin-top:10px}.option{display:flex;align-items:center;gap:9px;border:1px solid var(--line);padding:11px;border-radius:11px;background:#fff}.option input{accent-color:var(--teal);width:18px;height:18px}.notice{padding:12px 14px;border-radius:12px;background:#fff7df;color:#725817;font-size:13px;margin:14px 0}.success{background:#e8f6ed;color:#236342}.hidden{display:none!important}.student-shell{max-width:760px;margin:28px auto;padding:0 16px}.student-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.progress{height:7px;background:#e5eeeb;border-radius:20px;overflow:hidden;margin:15px 0}.progress div{height:100%;background:var(--teal);width:0}.student-question{font-size:23px;line-height:1.25;font-weight:800;margin:18px 0}.answerbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.student-option{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;margin:9px 0;background:#fff}.student-option input{width:19px;height:19px;accent-color:var(--teal)}.student-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.timer{font-weight:850;color:var(--teal);background:#e8f5f1;padding:7px 12px;border-radius:10px}.tool-fab{position:fixed;right:18px;bottom:20px;z-index:20}.toolbox{position:fixed;right:18px;bottom:80px;width:min(300px,calc(100vw - 36px));background:white;border:1px solid var(--line);box-shadow:0 12px 40px #0002;border-radius:16px;padding:15px;z-index:21}.toolbox input{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;margin:4px 0}.toolbox .calc-display{text-align:right;font-size:24px;font-weight:800;background:#f2f7f5;padding:10px;border-radius:9px}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.calc-grid button{padding:10px 0}.result-row{padding:12px 0;border-bottom:1px solid var(--line)}.score{font-size:42px;font-weight:900;color:var(--teal)}.empty{text-align:center;padding:35px;color:var(--muted)}.tiny{font-size:12px;color:var(--muted)}.linkbox{background:#f2f8f6;border:1px dashed #9bbdb4;padding:12px;border-radius:12px;overflow-wrap:anywhere}.footer{text-align:center;color:var(--muted);font-size:12px;padding:35px 12px}
@media(max-width:720px){.grid,.grid3{grid-template-columns:1fr}.wrap{margin:18px auto}.hero{align-items:flex-start;flex-direction:column}.topin{padding:11px 14px}.panel{padding:15px}.student-question{font-size:21px}.student-actions button{flex:1}.desktop-only{display:none}}
.corr-option{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:6px 0;background:#fff;font-size:14px}.corr-option.opt-c{border-color:#7cc4a0;background:#e8f6ed;color:#1d5a3d}.corr-option.opt-w{border-color:#e3a0a5;background:#fff0f0;color:var(--red)}details>summary{list-style:revert}
</style>

<body>
<header class="top"><div class="topin"><div class="brand">Classe<span>QCM</span></div><div class="row"><span class="tiny desktop-only">La plateforme de QCM pour les enseignants</span><button class="secondary small" onclick="goHome()">Accueil</button></div></div></header>
<main id="app"></main>
<footer class="footer">ClasseQCM · Synchronisation Firebase · Les accès sont protégés par les règles de la base.</footer>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAviiDdXz71Jr0XxHpuQJWKgEiQzlR5gRs",
  authDomain: "flashmail-5650b.firebaseapp.com",
  databaseURL: "https://flashmail-5650b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "flashmail-5650b",
  storageBucket: "flashmail-5650b.firebasestorage.app",
  messagingSenderId: "356335559074",
  appId: "1:356335559074:web:6f580cbcef71d807aa92fb"
};
firebase.initializeApp(firebaseConfig);
const fbAuth=firebase.auth(), fbDb=firebase.database();
let fbUser=null, cloudReady=false;
fbAuth.onAuthStateChanged(user=>{fbUser=user;cloudReady=true;if(location.hash)route();else renderHome();if(user&&!user.isAnonymous){loadTeacherQuizzes().then(()=>{if(fbUser&&fbUser.uid===user.uid&&!location.hash)renderHome()}).catch(e=>{console.error('Chargement des QCM:',e);const el=document.getElementById('quizList');if(el)el.innerHTML='<div class="notice">Compte connecté. La synchronisation des QCM a échoué : '+esc(authMessage(e))+'</div>'})}});
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DB='classeqcm_v1'; let state=load(), current=null, attempt={}, timerId=null, seconds=0, locked={}, preview=false, toolOpen=false;
function load(){try{return JSON.parse(localStorage.getItem(DB))||{quizzes:[],results:[]}}catch(e){return{quizzes:[],results:[]}}}
function save(){localStorage.setItem(DB,JSON.stringify(state))}
function uid(){return Math.random().toString(36).slice(2,9)}
function goHome(){stopTimer();renderHome()}
function renderHome(){
 $('#app').innerHTML=`<div class="wrap"><div class="hero"><div><h1>Les évaluations, en plus simple.</h1><div class="muted">Crée un QCM, partage un lien et retrouve les résultats par élève et par classe.</div></div><button onclick="newQuiz()">＋ Créer un QCM</button></div>
 <div class="grid"><section class="panel"><h2>Espace professeur</h2><p class="muted">Connecte-toi pour retrouver tes QCM et consulter les résultats sur tous tes appareils.</p>${fbUser&&!fbUser.isAnonymous?`<p class="tiny success">Connecté : ${esc(fbUser.email||'professeur')}</p><button onclick="newQuiz()">＋ Créer un QCM</button> <button class="ghost small" onclick="teacherLogout()">Déconnexion</button>`:`<button onclick="teacherAccess()">Connexion / créer un compte professeur</button>`}</section><section class="panel"><h2>Rejoindre un QCM</h2><p class="muted">Un élève peut ouvrir directement le lien reçu de son professeur.</p><div class="field"><label>Code du QCM</label><input id="joinCode" placeholder="Ex. ab12cd3"></div><button class="secondary" onclick="joinByCode()">Rejoindre</button></section></div>
 <div class="row between" style="margin:28px 0 12px"><h2>Mes QCM</h2><span class="tiny">${fbUser&&!fbUser.isAnonymous?state.quizzes.length:0} QCM synchronisé(s)</span></div>
 <div id="quizList">${fbUser&&!fbUser.isAnonymous&&state.quizzes.length?state.quizzes.map(q=>`<div class="card" style="margin:10px 0"><div class="row between"><div><b>${esc(q.title)}</b><div class="tiny">${q.questions.length} question(s) · ${q.attempts===0?'Tentatives illimitées':q.attempts+' tentative(s)'} · ${q.duration? q.duration+' min':'Sans limite de temps'}</div></div><span class="pill">${q.code}</span></div><div class="row" style="margin-top:13px"><button class="small" onclick="editQuiz('${q.id}')">Modifier</button><button class="small secondary" onclick="showLinks('${q.id}')">Liens</button><button class="small secondary" onclick="showResults('${q.id}')">Résultats</button><button class="small ghost" onclick="previewQuiz('${q.id}')">Tester</button><button class="small danger" onclick="deleteQuiz('${q.id}')">Supprimer</button></div></div>`).join(''):'<div class="empty">Aucun QCM pour le moment. Crée ton premier QCM !</div>'}</div></div>`;
}
function newQuiz(){if(!fbUser||fbUser.isAnonymous){teacherAccess();return}current={id:uid(),code:uid(),title:'Nouveau QCM',description:'',duration:0,attempts:0,showCorrection:true,showScore:true,calculator:false,questions:[makeQuestion()]};renderEditor()}
function makeQuestion(){return{id:uid(),type:'single',text:'',options:['',''],correct:[0],answer:'',points:1}}
function editQuiz(id){current=state.quizzes.find(q=>q.id===id);renderEditor()}
function renderEditor(){
 const q=current;
 $('#app').innerHTML=`<div class="wrap"><div class="hero"><div><h1>Créateur de QCM</h1><div class="muted">Configure ton évaluation et ajoute autant de questions que nécessaire.</div></div><button class="ghost" onclick="goHome()">← Retour</button></div>
 <section class="panel"><div class="grid"><div class="field"><label>Titre du QCM</label><input id="qtitle" value="${esc(q.title)}" oninput="current.title=this.value"></div><div class="field"><label>Consigne / description</label><input id="qdesc" value="${esc(q.description)}" oninput="current.description=this.value"></div></div>
 <div class="grid3"><div class="field"><label>Durée (minutes, 0 = sans limite)</label><input type="number" min="0" id="duration" value="${q.duration}" oninput="current.duration=Math.max(0,+this.value)"></div><div class="field"><label>Nombre de tentatives</label><input type="number" min="0" id="attempts" value="${q.attempts}" oninput="current.attempts=Math.max(0,+this.value)"><span class="tiny">0 = tentatives à l'infini</span></div><div class="field"><label>Outils disponibles</label><label class="option"><input type="checkbox" ${q.calculator?'checked':''} onchange="current.calculator=this.checked"> Calculatrice intégrée</label></div></div>
 <div class="row"><label class="option"><input type="checkbox" ${q.showCorrection?'checked':''} onchange="current.showCorrection=this.checked"> Afficher le corrigé à la fin</label><label class="option"><input type="checkbox" ${q.showScore?'checked':''} onchange="current.showScore=this.checked"> Afficher le score final</label></div>
 <div class="notice">Astuce : le type « réponse libre » permet une correction manuelle par le professeur. Les réponses à choix sont corrigées automatiquement.</div></section>
 <div class="row between" style="margin:25px 0 8px"><h2>Questions <span class="pill">${q.questions.length}</span></h2><button onclick="addQuestion()">＋ Ajouter une question</button></div>
 <div id="questions">${q.questions.map((x,i)=>questionEditor(x,i)).join('')}</div>
 <div class="row between" style="margin-top:20px"><button class="ghost" onclick="previewQuiz(current.id,true)">Tester la vue élève</button><button onclick="saveQuiz()">Enregistrer le QCM</button></div></div>`;
}
function questionEditor(x,i){return `<div class="question-card"><div class="question-head"><b>Question ${i+1}</b><div class="row"><span class="pill">${x.points} pt(s)</span><button class="small danger" onclick="removeQuestion('${x.id}')">Supprimer</button></div></div>
 <div class="field"><label>Énoncé</label><textarea oninput="setQuestion('${x.id}','text',this.value)" placeholder="Écris ta question…">${esc(x.text)}</textarea></div>
 <div class="grid"><div class="field"><label>Type de réponse</label><select onchange="changeType('${x.id}',this.value)"><option value="single" ${x.type==='single'?'selected':''}>Choix unique</option><option value="multiple" ${x.type==='multiple'?'selected':''}>Choix multiples</option><option value="text" ${x.type==='text'?'selected':''}>Réponse libre (texte)</option><option value="number" ${x.type==='number'?'selected':''}>Réponse numérique</option></select></div><div class="field"><label>Points</label><input type="number" min="1" value="${x.points}" onchange="setQuestion('${x.id}','points',Math.max(1,+this.value))"></div></div>
 ${x.type==='text'||x.type==='number'?`<div class="field"><label>Réponse attendue (pour la correction automatique)</label><input value="${esc(x.answer)}" oninput="setQuestion('${x.id}','answer',this.value)" placeholder="Réponse attendue"></div>`:`<label><b>Propositions</b> <span class="tiny">Coche la/les bonne(s) réponse(s).</span></label>${x.options.map((o,j)=>`<div class="row" style="margin:7px 0"><input style="accent-color:var(--teal);width:19px;height:19px" type="${x.type==='multiple'?'checkbox':'radio'}" name="correct_${x.id}" ${x.correct.includes(j)?'checked':''} onchange="toggleCorrect('${x.id}',${j},this.checked)"><input class="answer-input" value="${esc(o)}" placeholder="Proposition ${j+1}" oninput="setOption('${x.id}',${j},this.value)"><button class="small danger" onclick="removeOption('${x.id}',${j})">×</button></div>`).join('')}<button class="small secondary" onclick="addOption('${x.id}')">＋ Ajouter une proposition</button>`}
 </div>`}
function setQuestion(id,k,v){let x=current.questions.find(a=>a.id===id);x[k]=v}
function setOption(id,j,v){current.questions.find(a=>a.id===id).options[j]=v}
function changeType(id,v){let x=current.questions.find(a=>a.id===id);x.type=v;x.correct=[];renderEditor()}
function toggleCorrect(id,j,on){let x=current.questions.find(a=>a.id===id);if(x.type==='single')x.correct=on?[j]:[];else x.correct=on?[...x.correct,j]:x.correct.filter(n=>n!==j);renderEditor()}
function addOption(id){current.questions.find(a=>a.id===id).options.push('');renderEditor()}
function removeOption(id,j){let x=current.questions.find(a=>a.id===id);x.options.splice(j,1);x.correct=x.correct.filter(n=>n!==j).map(n=>n>j?n-1:n);renderEditor()}
function addQuestion(){current.questions.push(makeQuestion());renderEditor()}
function removeQuestion(id){if(current.questions.length===1){alert('Un QCM doit contenir au moins une question.');return}current.questions=current.questions.filter(q=>q.id!==id);renderEditor()}
async function saveQuiz(){if(!fbUser||fbUser.isAnonymous){alert('Connecte-toi avec ton compte professeur.');teacherAccess();return}if(!current.title.trim()){alert('Donne un titre au QCM.');return}if(!current.questions.length){alert('Ajoute une question.');return}for(let x of current.questions){if(!x.text.trim()){alert('Chaque question doit avoir un énoncé.');return}if((x.type==='single'||x.type==='multiple')&&(!x.options.some(o=>o.trim())||!x.correct.length)){alert('Ajoute des propositions et coche la bonne réponse pour chaque question à choix.');return}}
 current.ownerUid=fbUser.uid;let i=state.quizzes.findIndex(q=>q.id===current.id);if(i<0)state.quizzes.push(structuredClone(current));else state.quizzes[i]=structuredClone(current);save();
 try{await fbDb.ref('quizzes/'+current.code).set(current);await fbDb.ref('teacherQuizzes/'+fbUser.uid+'/'+current.code).set(true);goHome();alert('QCM enregistré et synchronisé avec Firebase.')}catch(e){alert('Erreur Firebase : '+e.message)} }

async function deleteQuiz(id){let q=state.quizzes.find(q=>q.id===id);if(confirm('Supprimer ce QCM et ses résultats ?')){try{await fbDb.ref('quizzes/'+q.code).remove();await fbDb.ref('teacherQuizzes/'+fbUser.uid+'/'+q.code).remove();await fbDb.ref('results/'+q.code).remove()}catch(e){alert('Erreur Firebase : '+e.message);return}state.quizzes=state.quizzes.filter(q=>q.id!==id);state.results=state.results.filter(r=>r.quizId!==id);save();renderHome()}}
function showLinks(id){let q=state.quizzes.find(q=>q.id===id);let base=location.href.split('#')[0];let student=base+'#faire='+q.code;let results=base+'#resultats='+q.code;$('#app').innerHTML=`<div class="wrap"><button class="ghost" onclick="goHome()">← Retour</button><h1>Partager « ${esc(q.title)} »</h1><section class="panel"><h3>Lien élève — pour participer</h3><div class="linkbox">${esc(student)}</div><button style="margin-top:9px" onclick="copyText('${student}')">Copier le lien élève</button><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>Lien professeur — résultats</h3><div class="linkbox">${esc(results)}</div><button style="margin-top:9px" onclick="copyText('${results}')">Copier le lien résultats</button><div class="notice">Dans cette version prototype, les liens fonctionnent sur le même appareil/navigateur. Pour que les élèves répondent depuis leur téléphone et que le professeur récupère les résultats à distance, il faut connecter une base de données en ligne (par exemple Firebase ou Supabase) et sécuriser l'accès professeur.</div></section></div>`}
function copyText(t){navigator.clipboard?.writeText(t).then(()=>alert('Lien copié !')).catch(()=>prompt('Copie ce lien :',t))}
async function joinByCode(){let c=$('#joinCode').value.trim();try{let snap=await fbDb.ref('quizzes/'+c).once('value'),q=snap.val();if(!q){alert('Code QCM introuvable.');return}startStudent(q)}catch(e){alert('Impossible de charger ce QCM : '+e.message)}}
function previewQuiz(id,fromEditor=false){let q=fromEditor?current:state.quizzes.find(q=>q.id===id);if(fromEditor){saveDraftOnly()}startStudent(q,true)}
function saveDraftOnly(){/* Le test utilise la configuration courante sans l'enregistrer. */}
async function startStudent(q,isPreview=false){stopTimer();current=q;preview=isPreview;attempt={answers:{},index:0,student:{first:'',last:'',klass:''},started:false};locked={};if(!isPreview){try{if(!fbAuth.currentUser||!fbAuth.currentUser.isAnonymous)await fbAuth.signInAnonymously()}catch(e){alert('Connexion élève impossible : '+e.message);return}renderIdentity()}else{attempt.student={first:'Mode',last:'aperçu',klass:'Professeur'};beginQuiz()}}
function renderIdentity(){ $('#app').innerHTML=`<div class="student-shell"><div class="panel"><div class="brand">Classe<span>QCM</span></div><h1>${esc(current.title)}</h1><p class="muted">${esc(current.description)}</p><p>${current.questions.length} question(s) · ${current.duration?current.duration+' minutes':'Sans limite de temps'} · ${current.attempts===0?'Tentatives illimitées':current.attempts+' tentative(s) maximum'}</p><h3>Avant de commencer</h3><div class="field"><label>Prénom</label><input id="first" autocomplete="given-name" required></div><div class="field"><label>Nom</label><input id="last" autocomplete="family-name" required></div><div class="field"><label>Classe</label><input id="klass" placeholder="Ex. 3e B" required></div><button onclick="submitIdentity()">Commencer le QCM</button></div></div>`}
async function submitIdentity(){let first=$('#first').value.trim(),last=$('#last').value.trim(),klass=$('#klass').value.trim();if(!first||!last||!klass){alert('Remplis le prénom, le nom et la classe.');return}attempt.student={first,last,klass};try{let snap=await fbDb.ref('results/'+current.code).once('value'),all=snap.val()||{};let used=Object.values(all).filter(r=>r.first?.toLowerCase()===first.toLowerCase()&&r.last?.toLowerCase()===last.toLowerCase()&&r.klass?.toLowerCase()===klass.toLowerCase()).length;if(current.attempts>0&&used>=current.attempts){alert('Le nombre maximum de tentatives est atteint pour cet élève.');return}}catch(e){alert('Impossible de vérifier les tentatives : '+e.message);return}beginQuiz()}

function beginQuiz(){attempt.started=true;attempt.index=0;seconds=current.duration*60;renderQuestion();if(current.duration>0){timerId=setInterval(()=>{seconds--;let t=$('#timer');if(t)t.textContent=formatTime(seconds);if(seconds<=0){stopTimer();finishQuiz(true)}},1000)}}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function formatTime(s){return Math.floor(Math.max(0,s)/60).toString().padStart(2,'0')+':'+(Math.max(0,s)%60).toString().padStart(2,'0')}
function renderQuestion(){let i=attempt.index,x=current.questions[i],total=current.questions.length,ans=attempt.answers[x.id];let lockedQ=!!locked[x.id];$('#app').innerHTML=`<div class="student-shell"><div class="student-top"><div><div class="brand">Classe<span>QCM</span></div><div class="tiny">${esc(current.title)}</div></div><div class="row">${current.calculator?'<button class="secondary small" onclick="toggleTool()">Calculatrice</button>':''}${current.duration?`<span class="timer" id="timer">${formatTime(seconds)}</span>`:''}<button class="danger small" onclick="finishEarly()">Terminer</button></div></div><div class="progress"><div style="width:${(i+1)/total*100}%"></div></div><div class="row between"><b>Question ${i+1} sur ${total}</b><span class="tiny">${x.points} point(s)</span></div><div class="student-question">${esc(x.text)}</div><div class="answerbox">${renderAnswer(x,ans,lockedQ)}</div><div class="student-actions">${i>0?'<button class="ghost" onclick="previousQuestion()">← Précédente</button>':'<span></span>'}${i<total-1?`<button onclick="nextQuestion()">${lockedQ?'Continuer':'Valider et continuer'} →</button>`:`<button onclick="finishQuiz(false)">Terminer le QCM ✓</button>`}</div><p class="tiny">Une réponse validée ne peut plus être modifiée. Tu peux revenir aux questions précédentes pour les consulter. Appuie sur « Terminer » pour envoyer tes résultats au professeur et voir le corrigé.</p></div>${toolOpen&&current.calculator?calculatorHTML():''}${current.calculator?'<button class="tool-fab" onclick="toggleTool()">🧮 Outils</button>':''}`}
function renderAnswer(x,ans,isLocked){if(x.type==='single'||x.type==='multiple')return `<div class="options">${x.options.map((o,j)=>`<label class="student-option"><input ${isLocked?'disabled':''} type="${x.type==='single'?'radio':'checkbox'}" name="ans_${x.id}" value="${j}" ${Array.isArray(ans)&&ans.includes(j)?'checked':''} onchange="chooseOption('${x.id}',${j},this.checked)"><span>${esc(o)}</span></label>`).join('')}</div>`;return `<div class="field"><label>Ta réponse</label><input class="answer-input" ${isLocked?'disabled':''} value="${esc(ans??'')}" oninput="attempt.answers['${x.id}']=this.value" placeholder="Écris ta réponse…"></div>`}
function chooseOption(id,j,on){let x=current.questions.find(a=>a.id===id);let a=attempt.answers[id]||[];if(x.type==='single')a=[j];else a=on?[...a,j]:a.filter(n=>n!==j);attempt.answers[id]=a}
function validateCurrent(){let x=current.questions[attempt.index];if(locked[x.id])return;let a=attempt.answers[x.id];if(x.type==='single'||x.type==='multiple'){if(!a||!a.length){alert('Choisis une réponse avant de continuer.');return false}}else if(a===undefined||String(a).trim()===''){alert('Saisis une réponse avant de continuer.');return false}locked[x.id]=true;return true}
function nextQuestion(){if(!validateCurrent())return;attempt.index++;renderQuestion()}
function previousQuestion(){if(attempt.index>0){attempt.index--;renderQuestion()}}
function finishQuiz(timeout=false,early=false){if(attempt.finished)return;if(!timeout&&!early){let x=current.questions[attempt.index];if(!locked[x.id]&&!validateCurrent())return}attempt.finished=true;stopTimer();toolOpen=false;let score=0,max=0,details=[];const num=s=>parseFloat(String(s).replace(/\s/g,'').replace(',','.'));current.questions.forEach(x=>{max+=x.points;let a=attempt.answers[x.id],ok=false,auto=x.type!=='text';if(x.type==='single'||x.type==='multiple'){let aa=(Array.isArray(a)?a:[]).slice().sort((p,q)=>p-q),cc=(x.correct||[]).slice().sort((p,q)=>p-q);ok=aa.length>0&&aa.length===cc.length&&aa.every((v,i)=>v===cc[i])}else if(String(x.answer||'').trim()){let given=String(a??'').trim(),exp=String(x.answer).trim();if(x.type==='number'&&isFinite(num(given))&&isFinite(num(exp)))ok=num(given)===num(exp);else ok=given.toLowerCase()===exp.toLowerCase()}if(ok)score+=x.points;details.push({text:x.text,type:x.type,answer:a===undefined?null:a,correct:x.correct||[],options:x.options||[],expected:x.answer||'',ok,auto,points:x.points})});let r={id:uid(),quizId:current.id,first:attempt.student.first,last:attempt.student.last,klass:attempt.student.klass,date:new Date().toISOString(),score,max,details,timeout:!!timeout};r=JSON.parse(JSON.stringify(r));attempt.result=r;attempt.sendState=preview?'preview':'sending';renderEnd(r);if(!preview)sendResult(r)}
function sendStatusHTML(){const s=attempt.sendState;if(s==='preview')return '<div class="notice">Mode aperçu : aucun résultat n’est envoyé au professeur.</div>';if(s==='ok')return '<div class="notice success">✓ Tes résultats ont bien été transmis au professeur.</div>';if(s==='error')return `<div class="notice" style="background:#fff0f0;color:var(--red)">⚠ Tes résultats n’ont pas pu être envoyés${attempt.sendError?' ('+esc(attempt.sendError)+')':''}. Vérifie ta connexion puis appuie sur « Réessayer l’envoi ».<div style="margin-top:10px"><button class="small" onclick="retrySend()">Réessayer l’envoi</button></div></div>`;return '<div class="notice">Envoi de tes résultats au professeur…</div>'}
function setSendStatus(s,err){attempt.sendState=s;attempt.sendError=err||'';const el=document.getElementById('sendStatus');if(el)el.innerHTML=sendStatusHTML();const b=document.getElementById('endBtn');if(b){b.disabled=s==='sending';b.textContent=s==='sending'?'Envoi en cours…':'Terminer'}}
async function sendResult(r){const code=current.code;setSendStatus('sending');try{if(!fbAuth.currentUser)await fbAuth.signInAnonymously();await fbDb.ref('results/'+code+'/'+r.id).set(r);if(!state.results.some(x=>x.id===r.id))state.results.push(r);save();setSendStatus('ok')}catch(e){console.error(e);setSendStatus('error',authMessage(e))}}
function retrySend(){if(attempt.result)sendResult(attempt.result)}
function finishEarly(){let unanswered=current.questions.filter(x=>{let a=attempt.answers[x.id];return Array.isArray(a)?!a.length:(a===undefined||String(a).trim()==='')}).length;if(!confirm(unanswered?'Il reste '+unanswered+' question(s) sans réponse (elles seront comptées fausses). Terminer le QCM maintenant ?':'Terminer le QCM et envoyer tes résultats au professeur ?'))return;finishQuiz(false,true)}
function closeQuiz(){if(attempt.sendState==='sending'){alert('Patiente, tes résultats sont en cours d’envoi.');return}if(attempt.sendState==='error'&&!confirm('Tes résultats n’ont PAS été envoyés au professeur. Quitter quand même ?'))return;attempt.sent=true;goHome()}
window.addEventListener('beforeunload',e=>{if(attempt&&attempt.finished&&(attempt.sendState==='sending'||attempt.sendState==='error')){e.preventDefault();e.returnValue=''}});
function detailHTML(d,i){const opts=Array.isArray(d.options)?d.options:[],cor=Array.isArray(d.correct)?d.correct:[],ans=d.answer,isChoice=opts.length>0&&cor.length>0,manual=!isChoice&&!d.expected,chosen=Array.isArray(ans)?ans:[];const badge=manual?'<span class="pill" style="background:#fff7df;color:#725817">À corriger par le professeur</span>':d.ok?'<span class="pill" style="background:#e8f6ed;color:var(--green)">✓ Bonne réponse</span>':'<span class="pill" style="background:#fff0f0;color:var(--red)">✕ À revoir</span>';let body;if(isChoice){body='<div class="options">'+opts.map((o,j)=>{const isC=cor.includes(j),isS=chosen.includes(j);const cls=isC?'opt-c':(isS?'opt-w':'');const tag=isC&&isS?'✓ Ta réponse (correcte)':isC?'✓ Bonne réponse':isS?'✕ Ta réponse':'';return `<div class="corr-option ${cls}"><span>${esc(o)}</span><span class="tiny" style="font-weight:700">${tag}</span></div>`}).join('')+'</div>'}else{const given=Array.isArray(ans)?ans.map(k=>opts[k]).join(', '):(ans==null||ans===''?'Sans réponse':ans);body=`<div class="corr-option ${manual?'':(d.ok?'opt-c':'opt-w')}"><span>Ta réponse : <b>${esc(given)}</b></span></div>`+(manual?'':`<div class="corr-option opt-c"><span>Réponse attendue : <b>${esc(d.expected)}</b></span></div>`)}return `<div class="result-row"><div class="row between"><b>${i+1}. ${esc(d.text)}</b>${badge}</div>${body}</div>`}
function renderEnd(r){let q=current;$('#app').innerHTML=`<div class="student-shell"><div class="panel"><div class="brand">Classe<span>QCM</span></div><h1>${preview?'Aperçu terminé':'QCM terminé !'}</h1><p class="muted">${esc(r.first)} ${esc(r.last)} · ${esc(r.klass)}</p>${r.timeout?'<div class="notice">Le temps est écoulé : le QCM a été terminé automatiquement.</div>':''}<div id="sendStatus">${sendStatusHTML()}</div>${q.showScore!==false?`<div class="score">${r.score} / ${r.max}</div><b>Score final</b>`:'<p>Ton résultat a été transmis au professeur.</p>'}${q.showCorrection!==false?`<h2 style="margin-top:25px">Corrigé</h2>${r.details.map((d,i)=>detailHTML(d,i)).join('')}`:''}<div class="row" style="margin-top:22px"><button id="endBtn" onclick="closeQuiz()" ${attempt.sendState==='sending'?'disabled':''}>${attempt.sendState==='sending'?'Envoi en cours…':'Terminer'}</button>${!preview&&q.attempts!==1?'<button class="secondary" onclick="retryQuiz()">Refaire le QCM</button>':''}</div></div></div>`;window.scrollTo(0,0)}
function answerLabel(d){return Array.isArray(d.answer)?d.answer.map(i=>d.options[i]).join(', '):(d.answer??'Sans réponse')}
function expectedLabel(d){return (d.correct&&d.correct.length)?d.correct.map(i=>d.options[i]).join(', '):(d.expected||'Correction manuelle par le professeur')}
function resultsRows(rs){return rs.length?rs.map(r=>`<div class="result-row"><div class="row between"><b>${esc(r.first)} ${esc(r.last)} <span class="pill">${esc(r.klass)}</span></b><b>${r.score}/${r.max}</b></div><div class="tiny">${new Date(r.date).toLocaleString('fr-FR')} · ${r.timeout?'Temps écoulé':'Terminé'}</div>${Array.isArray(r.details)?`<details style="margin-top:8px"><summary class="tiny" style="cursor:pointer;color:var(--teal);font-weight:700">Voir le détail des réponses</summary>${r.details.map((d,i)=>detailHTML(d,i)).join('')}</details>`:''}</div>`).join(''):"<div class=\"empty\">Aucun élève n'a encore répondu.</div>"}
async function retryQuiz(){if(!current||!attempt.student.first)return;try{const snap=await fbDb.ref('results/'+current.code).once('value'),all=snap.val()||{},student=attempt.student;const used=Object.values(all).filter(r=>r.first?.toLowerCase()===student.first.toLowerCase()&&r.last?.toLowerCase()===student.last.toLowerCase()&&r.klass?.toLowerCase()===student.klass.toLowerCase()).length;if(current.attempts>0&&used>=current.attempts){alert('Le nombre maximum de tentatives est atteint pour cet élève.');return}startStudent(current)}catch(e){alert('Impossible de vérifier les tentatives : '+authMessage(e))}}
async function showResults(id){let q=state.quizzes.find(q=>q.id===id);if(!q){alert('QCM introuvable dans ton espace.');return}if(!fbUser||fbUser.isAnonymous){teacherAccess();return}try{let snap=await fbDb.ref('results/'+q.code).once('value');let remote=snap.val()||{};state.results=state.results.filter(r=>r.quizId!==id).concat(Object.values(remote));}catch(e){alert('Impossible de charger les résultats : '+e.message);return}let rs=state.results.filter(r=>r.quizId===id);$('#app').innerHTML=`<div class="wrap"><div class="hero"><div><h1>Résultats</h1><div class="muted">${esc(q.title)}</div></div><button class="ghost" onclick="goHome()">← Retour</button></div><div class="panel"><div class="row between"><h2>Résultats des élèves</h2><button class="secondary small" onclick="exportCSV('${id}')">Exporter en CSV</button></div><div class="field"><label>Filtrer par classe</label><input id="filterClass" placeholder="Toutes les classes" oninput="filterResults('${id}')"></div><div id="resultsTable">${resultsRows(rs)}</div></div></div>`}

function filterResults(id){let rs=state.results.filter(r=>r.quizId===id),v=$('#filterClass').value.toLowerCase();$('#resultsTable').innerHTML=resultsRows(rs.filter(r=>r.klass.toLowerCase().includes(v)))}
function exportCSV(id){let rs=state.results.filter(r=>r.quizId===id);let rows=[['Prénom','Nom','Classe','Score','Total','Date'],...rs.map(r=>[r.first,r.last,r.klass,r.score,r.max,r.date])];let csv=rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='resultats-classeqcm.csv';a.click();URL.revokeObjectURL(a.href)}
function toggleTool(){toolOpen=!toolOpen;renderQuestion()}
function calculatorHTML(){return `<div class="toolbox"><div class="row between"><b>Calculatrice</b><button class="small ghost" onclick="toggleTool()">Fermer</button></div><div class="calc-display" id="calcDisplay">0</div><div class="calc-grid">${['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','C','+','='].map(k=>`<button class="${k==='='?'':'secondary'}" onclick="calcKey('${k}')">${k}</button>`).join('')}</div></div>`}
let calcExpr='';function calcKey(k){let d=$('#calcDisplay');if(!d)return;if(k==='C')calcExpr='';else if(k==='='){try{let safe=calcExpr.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-');if(!/^[0-9+*/().\-\s]+$/.test(safe))throw 0;calcExpr=String(Function('"use strict";return ('+safe+')')())}catch(e){calcExpr='Erreur'}}else calcExpr+=k;d.textContent=calcExpr||'0'}
async function showResultsByCode(code){if(!fbAuth.currentUser||fbAuth.currentUser.isAnonymous){teacherAccess();return}try{const snap=await fbDb.ref('teacherQuizzes/'+fbAuth.currentUser.uid+'/'+code).once('value');if(!snap.exists()){$('#app').innerHTML='<div class="wrap"><div class="panel">Ce lien de résultats est réservé au compte professeur propriétaire du QCM. <button onclick="goHome()">Accueil</button></div></div>';return}const qs=await fbDb.ref('quizzes/'+code).once('value'),q=qs.val();if(!q){$('#app').innerHTML='<div class="wrap">QCM introuvable.</div>';return}if(!state.quizzes.some(x=>x.code===code))state.quizzes.push(q);showResults(q.id)}catch(e){$('#app').innerHTML='<div class="wrap"><div class="panel">Impossible de charger les résultats : '+esc(authMessage(e))+' <button onclick="goHome()">Accueil</button></div></div>'}}
async function route(){let h=location.hash;if(h.startsWith('#faire=')){let code=h.split('=')[1];try{let snap=await fbDb.ref('quizzes/'+code).once('value'),q=snap.val();if(q)startStudent(q);else $('#app').innerHTML='<div class="wrap"><div class="panel">Ce QCM est introuvable. Vérifie le lien.</div></div>'}catch(e){$('#app').innerHTML='<div class="wrap"><div class="panel">Erreur de chargement : '+esc(e.message)+'</div></div>'}}else if(h.startsWith('#resultats='))showResultsByCode(h.split('=')[1]);else renderHome()}
async function teacherAccess(){ $('#app').innerHTML=`<div class="student-shell"><div class="panel"><div class="brand">Classe<span>QCM</span></div><h1>Espace professeur</h1><p class="muted">Connecte-toi ou crée ton compte professeur. Les élèves, eux, n'ont pas besoin de compte.</p><div class="field"><label>Adresse e-mail</label><input id="teacherEmail" type="email" autocomplete="email" placeholder="professeur@exemple.fr"></div><div class="field"><label>Mot de passe</label><input id="teacherPassword" type="password" autocomplete="current-password" placeholder="6 caractères minimum"></div><div class="row"><button id="loginBtn" onclick="teacherLogin()">Se connecter</button><button id="registerBtn" class="secondary" onclick="teacherRegister()">Créer mon compte</button></div><button class="ghost small" onclick="teacherResetPassword()">Mot de passe oublié ?</button><p id="authError" class="tiny" aria-live="polite"></p><button class="ghost small" style="margin-top:12px" onclick="goHome()">Retour</button></div></div>`}
function authError(message){const el=$('#authError');if(el)el.textContent=message}
function authBusy(busy){['loginBtn','registerBtn'].forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=busy})}
function validTeacherCredentials(){const email=$('#teacherEmail')?.value.trim()||'',password=$('#teacherPassword')?.value||'';if(!email){authError('Saisis ton adresse e-mail.');return null}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){authError('Vérifie le format de ton adresse e-mail.');return null}if(!password){authError('Saisis ton mot de passe.');return null}return {email,password}}
async function teacherLogin(){const data=validTeacherCredentials();if(!data)return;authBusy(true);authError('Connexion en cours…');try{const credential=await fbAuth.signInWithEmailAndPassword(data.email,data.password);fbUser=credential.user;renderHome();loadTeacherQuizzes().then(()=>{if(fbUser&&fbUser.uid===credential.user.uid&&!location.hash)renderHome()}).catch(e=>{console.error('Synchronisation après connexion:',e);const el=document.getElementById('quizList');if(el)el.innerHTML='<div class="notice">Connecté, mais impossible de synchroniser les QCM : '+esc(authMessage(e))+'</div>'})}catch(e){authError(authMessage(e))}finally{authBusy(false)}}
async function teacherRegister(){const data=validTeacherCredentials();if(!data)return;if(data.password.length<6){authError('Le mot de passe doit contenir au moins 6 caractères.');return}authBusy(true);authError('Création du compte en cours…');let timeoutId;try{const creation=fbAuth.createUserWithEmailAndPassword(data.email,data.password);const timeout=new Promise((_,reject)=>{timeoutId=setTimeout(()=>reject(Object.assign(new Error('Firebase ne répond pas. Vérifie ta connexion Internet et la configuration de la méthode E-mail/Mot de passe dans Firebase Authentication.'),{code:'auth/timeout'})),20000)});const credential=await Promise.race([creation,timeout]);clearTimeout(timeoutId);fbUser=credential.user;authError('Compte créé avec succès !');renderHome();loadTeacherQuizzes().then(()=>{if(fbUser&&fbUser.uid===credential.user.uid&&!location.hash)renderHome()}).catch(e=>{console.error('Synchronisation après inscription:',e);authError('Compte créé, mais la synchronisation des QCM a échoué : '+authMessage(e))})}catch(e){clearTimeout(timeoutId);authError(e.code==='auth/timeout'?e.message:authMessage(e))}finally{authBusy(false)}}
async function teacherResetPassword(){const email=$('#teacherEmail')?.value.trim()||'';if(!email){authError('Saisis ton adresse e-mail pour recevoir le lien de réinitialisation.');return}try{await fbAuth.sendPasswordResetEmail(email);authError('E-mail envoyé si cette adresse correspond à un compte. Vérifie ta boîte de réception et tes courriers indésirables.')}catch(e){authError(authMessage(e))}}
function authMessage(e){const messages={'auth/email-already-in-use':'Cette adresse possède déjà un compte. Connecte-toi.','auth/invalid-email':'Adresse e-mail invalide.','auth/weak-password':'Mot de passe trop faible : utilise au moins 6 caractères.','auth/user-not-found':'Aucun compte trouvé avec cette adresse.','auth/wrong-password':'Mot de passe incorrect.','auth/invalid-credential':'Adresse e-mail ou mot de passe incorrect.','auth/too-many-requests':'Trop de tentatives. Réessaie plus tard.','auth/network-request-failed':'Problème de connexion Internet. Réessaie.','auth/operation-not-allowed':'La connexion par e-mail/mot de passe n’est pas activée dans Firebase Authentication.','auth/email-not-verified':'Confirme ton adresse e-mail si la vérification est activée.','auth/timeout':'Firebase ne répond pas après 20 secondes. Vérifie la connexion Internet et que E-mail/Mot de passe est activé dans Firebase Authentication.'};return messages[e.code]||e.message||'Une erreur inconnue est survenue.'}
async function loadTeacherQuizzes(){const user=fbAuth.currentUser;if(!user||user.isAnonymous)return;const snap=await fbDb.ref('teacherQuizzes/'+user.uid).once('value'),codes=snap.val()||{},loaded=[];for(const code of Object.keys(codes)){const q=await fbDb.ref('quizzes/'+code).once('value');if(q.exists())loaded.push(q.val())}state.quizzes=loaded;save()}
async function teacherLogout(){try{await fbAuth.signOut();state.quizzes=[];renderHome()}catch(e){alert('Déconnexion impossible : '+authMessage(e))}}
</script>
</body>
